  const a = document.createElement('a'); a.href = '#/' + id;
  a.innerHTML = `<img alt="" src="${ic.toDataURL()}"><span><b>${esc(P.name)}</b><small>${esc(P.kind)}</small></span>`;
  a.addEventListener('click', e => { e.preventDefault(); $('stage').scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'center' }); openPage(id); });
  dir.appendChild(a);
}

/* toggles */
function setNight(v) { S.night = v; $('tNight').textContent = v ? '☀ Day' : '☾ Night'; $('clock').textContent = v ? '☾ NIGHT' : '☀ DAY'; }
$('tNight').onclick = () => setNight(!S.night);
$('tLabels').onclick = () => { S.labels = !S.labels; labels.classList.toggle('off', !S.labels); $('tLabels').textContent = 'Labels: ' + (S.labels ? 'on' : 'off'); };
setNight(S.night);
if (innerWidth < 640) { S.labels = false; labels.classList.add('off'); $('tLabels').textContent = 'Labels: off'; }

/* input */
const KEYS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (S.page) { if (e.key === 'Escape') closePage(); return; }
  const r = cv.getBoundingClientRect(), onScreen = r.top < innerHeight * .6 && r.bottom > innerHeight * .4;
  const stageFocus = document.activeElement === cv || (document.activeElement === document.body && onScreen);
  if (S.dialog && ['Enter', ' ', 'KeyE', 'Escape'].some(k => e.key === k || e.code === k)) { e.preventDefault(); advance(); return; }
  const d = KEYS[e.code];
  if (d) { if (stageFocus || e.code.startsWith('Key')) { e.preventDefault(); if (!S.held.includes(d)) S.held.push(d); hint.hidden = true; } return; }
  if ((e.key === 'Enter' || e.key === ' ' || e.code === 'KeyE') && stageFocus) { e.preventDefault(); const o = target(); if (o) interact(o); }
});
addEventListener('keyup', e => { const d = KEYS[e.code]; if (d) S.held = S.held.filter(k => k !== d); });
addEventListener('blur', () => { S.held = []; });
cv.addEventListener('click', e => {
  cv.focus({ preventScroll: true });
  if (S.dialog) { advance(); return; } if (S.busy) return;
  const r = cv.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / r.width * MW), y = Math.floor((e.clientY - r.top) / r.height * MH);
  if (!inB(x, y)) return;
  const o = occ[y][x];
  if (o && o.act) return goTo(o);
  const path = bfs([[x, y]]); if (path) { player.path = path; player.then = null; }
  hint.hidden = true;
});
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / r.width * MW), y = Math.floor((e.clientY - r.top) / r.height * MH);
  const o = inB(x, y) && occ[y][x]; cv.style.cursor = o && o.act ? 'pointer' : 'crosshair';
});
document.querySelectorAll('[data-d]').forEach(b => {
  const d = b.dataset.d, on = e => { e.preventDefault(); if (!S.held.includes(d)) S.held.push(d); }, off = () => { S.held = S.held.filter(k => k !== d); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
});
$('bA').onclick = () => { if (S.dialog) return advance(); const o = target(); if (o) interact(o); };
$('bB').onclick = () => { if (S.page) closePage(); else if (S.dialog) advance(); };

/* loop */
const youEl = $('you');
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (S.dialog) { const d = S.dialog; d.n = Math.min(d.lines[d.i].length, d.n + dt * 70); $('dText').textContent = d.lines[d.i].slice(0, Math.floor(d.n)); }
  if (!S.page) { update(dt); render(now / 1000); updatePrompt(); }
  if (!youEl.hidden) { if (player.steps > 0) youEl.hidden = true; else { youEl.style.left = ((player.px + 8) / cv.width * 100) + '%'; youEl.style.top = ((player.py - 4) / cv.height * 100) + '%'; } }
  requestAnimationFrame(frame);
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { requestAnimationFrame(frame); route(); });
</script>
</body>
